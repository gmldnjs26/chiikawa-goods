# PR과 main 푸시에서 돈다. 외부 사이트에 요청을 보내지 않는다 —
# 테스트는 전부 픽스처이고, DB는 서비스 컨테이너다.
name: ci

on:
  pull_request:
  push:
    branches: [main]

# 같은 PR에 새 푸시가 오면 앞 실행을 취소한다
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # DB 없이 도는 것. 실패하면 빨리 알아야 한다
  be-check:
    name: be · lint · typecheck · test · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: be
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: be/package.json
          cache: npm
          cache-dependency-path: be/package-lock.json
      - run: npm ci
      - run: npm run lint -- --max-warnings=0
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  # migration은 실제 Postgres에서만 검증된다 (be/CLAUDE.md §3 「변경 후 확인 3개」).
  # 1) run → generate가 No changes여야 한다 (엔티티↔DB drift 없음)
  # 2) revert → run 왕복. 롤백 안 되는 migration은 결함이다
  be-migration:
    name: be · migration round-trip
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: be
    services:
      postgres:
        # 로컬 docker compose와 메이저를 맞춘다 (docs/tech-stack.md §1.3)
        image: postgres:18-alpine
        env:
          POSTGRES_USER: chiikawa
          POSTGRES_PASSWORD: chiikawa
          POSTGRES_DB: chiikawa
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U chiikawa"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: '5433'
      DB_USER: chiikawa
      DB_PASSWORD: chiikawa
      DB_NAME: chiikawa
      DB_SSL: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: be/package.json
          cache: npm
          cache-dependency-path: be/package-lock.json
      - run: npm ci
      - name: migration up
        run: npm run migration:run
      - name: no drift between entities and DB
        run: |
          set -e
          if npm run migration:generate -- src/migrations/CiDriftCheck 2>&1 | tee /tmp/gen.log | grep -q "No changes in database schema"; then
            echo "drift 없음"
          else
            echo "::error::엔티티와 DB가 어긋난다. migration:generate 결과:"
            cat /tmp/gen.log
            ls src/migrations/*CiDriftCheck* 2>/dev/null && cat src/migrations/*CiDriftCheck*
            exit 1
          fi
      - name: revert all, then run again
        run: |
          set -e
          count=$(npm run --silent migration:show 2>/dev/null | grep -c '\[X\]' || true)
          echo "적용된 migration: $count"
          for i in $(seq 1 "$count"); do npm run migration:revert; done
          npm run migration:run

  fe-check:
    name: fe · lint · typecheck · build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: fe/package.json
          cache: npm
          cache-dependency-path: fe/package-lock.json
      - run: npm ci
      - run: npm run lint -- --max-warnings=0
      - run: npm run typecheck
      - run: npm run build
