# 로컬 개발용 PostgreSQL. 프로덕션은 Cloud SQL (docs/tech-stack.md §1.3)
services:
  postgres:
    image: postgres:18-alpine
    container_name: chiikawa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: chiikawa
      POSTGRES_PASSWORD: chiikawa
      POSTGRES_DB: chiikawa
      TZ: Asia/Tokyo
    ports:
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chiikawa -d chiikawa']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
